<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questionnaire visiteurs</title>
  <style>
    :root {
      --bleu: #1F4E79;
      --fond: #F6F8FA;
      --texte: #333333;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--fond);
      color: var(--texte);
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }
    h1 {
      color: var(--bleu);
      font-size: 1.5rem;
      margin: 0 0 1.5rem;
      text-align: center;
    }
    .form-wrap {
      width: 100%;
      max-width: 760px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(31, 78, 121, 0.12);
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 1338px;
      border: 0;
      display: block;
    }
    @media (max-width: 600px) {
      iframe { height: 1800px; }
    }
  </style>
</head>
<body>
  <h1>Questionnaire visiteurs</h1>
  <div class="form-wrap">
    <!--
      Remplace l'URL ci-dessous par celle de TON formulaire :
      1. Ouvre ton Google Form.
      2. Clique sur "Envoyer" (en haut à droite).
      3. Choisis l'onglet avec l'icône <>.
      4. Coche "Intégrer l'élément HTML directement".
      5. Copie le lien qui apparaît dans src="..." et colle-le ci-dessous.
    -->
    <iframe
      src="https://docs.google.com/forms/d/e/1FAIpQLSeVpY3hhQBKNt8dl1zSJDCGgUjigukpJZl4xpDu25Kl4613tQ/viewform?embedded=true"
      title="Questionnaire visiteurs">
      Chargement du formulaire…
    </iframe>
  </div>
</body>
</html>
